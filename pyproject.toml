[project]
name = "regurag"
version = "0.2.0"
description = "Fully local, air-gapped Hebrew RAG chatbot (FastAPI + ChromaDB + Ollama + Streamlit)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<2",
    "uvicorn[standard]>=0.30,<1",
    "chromadb>=0.5,<2",
    "pdfplumber>=0.11,<1",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    "streamlit>=1.36,<2",
    "requests>=2.31,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3,<5",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend", "backend.api", "backend.core", "backend.services"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".opencode", "data", "artifacts", "project"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = ["E501", "SIM105", "B008", "SIM102", "SIM108", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E712"]  # sys.path shims + assert == True idioms are test-idiomatic

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["frontend", "eval", "tests", "artifacts", "data"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
ignore_errors = true
